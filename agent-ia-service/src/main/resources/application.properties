server.port=8089
spring.application.name=agent-ia-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Spring AI - Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.model=llama2

# MCP Client Configuration
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.timeout=30000

# Service endpoints for MCP connections
mcp.product-service.url=http://localhost:9091/mcp
mcp.stock-service.url=http://localhost:9092/mcp

# Logging
logging.level.org.springframework=INFO
logging.level.ma.ensa=DEBUG
