server:
  port: 8089

spring:
  application:
    name: agent-ia-service
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
    mcp:
      client:
        sse:
          connections:
            product-service-mcp:
              url: http://localhost:9091
            stock-service-mcp:
              url: http://localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.ai: DEBUG
    ma.ensa: DEBUG
